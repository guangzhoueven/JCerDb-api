<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JCer JSON · 数据服务</title>
<link rel="stylesheet" href="/style.css">
<script>
(function () {
  var t = localStorage.getItem('theme');
  if (t !== 'light' && t !== 'dark') {
    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span> JCer JSON</div>
  <nav class="nav">
    <button class="nav-btn active" data-view="data">数据</button>
    <button class="nav-btn" data-view="users" hidden>用户管理</button>
    <button class="nav-btn" data-view="sql" hidden>SQL 控制台</button>
    <button class="nav-btn" data-view="audit" hidden>审计日志</button>
  </nav>
  <div class="topbar-right">
    <button id="theme-toggle" class="icon-btn" title="切换主题">◐</button>
    <div id="auth-area">
      <button id="open-auth" class="btn btn-primary">登录 / 注册</button>
      <div id="user-box" hidden>
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-btn" class="btn btn-ghost">退出</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="view-data" class="view">
    <div class="toolbar">
      <h2>数据列表</h2>
      <div class="toolbar-actions">
        <label class="btn btn-ghost" for="import-file">导入 JSON 文件</label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <button id="new-data" class="btn btn-primary" hidden>+ 新建数据</button>
      </div>
    </div>
    <div id="data-list" class="card-grid"></div>

    <div id="editor" class="panel" hidden>
      <div class="editor-head">
        <input id="editor-name" placeholder="数据名称 (如 students)，可直接改名">
        <div class="segmented">
          <button class="seg active" data-mode="ui">UI 列表</button>
          <button class="seg" data-mode="json">JSON</button>
        </div>
        <button id="editor-save" class="btn btn-primary">保存</button>
        <button id="editor-delete" class="btn btn-danger">删除</button>
        <button id="editor-close" class="btn btn-ghost">关闭</button>
      </div>
      <div id="editor-note" class="note" hidden></div>
      <div id="ui-editor" class="ui-editor"></div>
      <textarea id="json-editor" class="json-editor" spellcheck="false" hidden></textarea>
    </div>
  </section>

  <section id="view-users" class="view" hidden>
    <div class="toolbar"><h2>用户管理</h2></div>
    <div class="table-wrap">
      <table id="users-table">
        <thead><tr><th>uid</th><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>最后登录</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-sql" class="view" hidden>
    <div class="toolbar"><h2>SQL 控制台</h2></div>
    <div class="panel">
      <textarea id="sql-input" class="json-editor" spellcheck="false" placeholder="输入任意 SQL 语句，例如 SELECT * FROM users;"></textarea>
      <div class="toolbar-actions" style="margin-top:8px">
        <button id="sql-run" class="btn btn-primary">执行</button>
        <span id="sql-msg" class="note"></span>
      </div>
      <div class="table-wrap" id="sql-result"></div>
    </div>
  </section>

  <section id="view-audit" class="view" hidden>
    <div class="toolbar"><h2>审计日志</h2></div>
    <div class="table-wrap">
      <table id="audit-table">
        <thead><tr><th>id</th><th>时间</th><th>用户</th><th>动作</th><th>详情</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="auth-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="segmented" style="margin-bottom:16px">
      <button class="seg active" data-auth="login">登录</button>
      <button class="seg" data-auth="register">注册</button>
    </div>
    <form id="auth-form">
      <input name="username" placeholder="用户名" autocomplete="username" required>
      <input name="password" type="password" placeholder="密码 (至少 6 位)" autocomplete="current-password" required>
      <div id="auth-msg" class="note error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">登录</button>
    </form>
    <button id="close-auth" class="btn btn-ghost btn-block">取消</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
